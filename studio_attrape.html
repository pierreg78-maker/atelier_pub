<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studio Attrape-X — MURMURE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070A14;--card:#12101C;--card2:#1A1730;--border:#2E2A4A;--fg:#F3EFE6;--muted:#9A93B0;
  --accent:#8B5CF6;--gold:#E8C36A;--ko:#F43F5E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:'Outfit',system-ui,sans-serif;color:var(--fg)}
#shell{min-height:100dvh;display:grid;grid-template-columns:minmax(280px,380px) 1fr}
@media(max-width:900px){#shell{grid-template-columns:1fr}}
#studio{background:linear-gradient(180deg,#120e22 0%,#070A14 100%);border-right:1px solid var(--border);padding:16px 16px 28px;overflow:auto;max-height:100dvh}
@media(max-width:900px){#studio{max-height:none;border-right:none;border-bottom:1px solid var(--border)}}
.studioHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.studioHead h1{font-size:18px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.studioHead p{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.4}
.badge{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);border:1px solid #8A6A2A;background:#1A1408;border-radius:999px;padding:4px 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px}
label.fld{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:8px 0 4px}
input[type=text],textarea,input[type=number]{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px}
textarea{min-height:56px;resize:vertical}
.hint{font-size:10px;color:var(--muted);line-height:1.35;margin-top:6px}
.thumb{width:100%;height:72px;border-radius:10px;border:1px dashed var(--border);background:#0A0C18 center/cover no-repeat;margin-top:6px}
.upload input{font-size:11px;max-width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}
.actions{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.btn{border:none;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:block;text-align:center;color:inherit}
.btnGo{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff}
.btnGhost{background:var(--card2);color:var(--fg);border:1px solid var(--border)}
#playCol{display:flex;flex-direction:column;min-height:100dvh;padding:8px;align-items:center}
#app{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#top{position:relative;display:flex;align-items:center;justify-content:center;height:50px}
#back{position:absolute;left:0;top:50%;transform:translateY(-50%);background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:12px;width:48px;height:48px;font-size:8px;line-height:10px;font-weight:700;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#title{font-size:20px;font-weight:900;letter-spacing:.18em;color:var(--gold)}
#tag{text-align:center;font-size:12px;color:var(--muted)}
#infos{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700}
#arena{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px}
.hole{border-radius:16px;background:#0a0c18;border:1px dashed var(--border);overflow:hidden;position:relative;cursor:pointer}
.hole img,.hole .ph{width:100%;height:100%;object-fit:cover;display:block;transform:translateY(110%);transition:transform .18s ease}
.hole.show img,.hole.show .ph{transform:translateY(0)}
.hole .ph{display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.4px}
.hole.good .ph{background:#1a3a28;color:#6ee7b7}
.hole.bad .ph{background:#3a1520;color:#fda4af}
#overlay{display:none;place-items:center;background:rgba(8,6,16,.82);backdrop-filter:blur(12px);border-radius:16px;padding:28px 20px;text-align:center;border:1px solid var(--border)}
#overlay.show{display:grid}
#ovTitle{font-size:24px;font-weight:900;color:var(--gold)}
#ovText{margin:8px 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.btnPrimary{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border:none;border-radius:999px;padding:11px 26px;font-weight:800;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="shell">
  <aside id="studio">
    <div class="studioHead">
      <div>
        <h1>Studio Attrape-X</h1>
        <p>Tapotez le produit. Évitez le bruit. Deux images, une durée.</p>
      </div>
      <span class="badge">MURMURE</span>
    </div>
    <div class="card">
      <h2>Identité</h2>
      <label class="fld">Titre</label>
      <input type="text" id="cfgTitle" maxlength="24" value="MURMURE">
      <label class="fld">Mission</label>
      <input type="text" id="cfgTag" maxlength="70" value="Attrapez le calme. Laissez passer la perceuse.">
    </div>
    <div class="card">
      <h2>À attraper</h2>
      <label class="fld">Nom</label>
      <input type="text" id="cfgGoodName" value="Calme">
      <div class="upload"><input type="file" id="cfgGood" accept="image/*"></div>
      <div class="thumb" id="goodThumb"></div>
      <h2 style="margin-top:12px">À éviter</h2>
      <label class="fld">Nom</label>
      <input type="text" id="cfgBadName" value="Perceuse">
      <div class="upload"><input type="file" id="cfgBad" accept="image/*"></div>
      <div class="thumb" id="badThumb"></div>
    </div>
    <div class="card">
      <h2>Durée</h2>
      <div class="row">
        <div><label class="fld">Secondes</label><input type="number" id="cfgTime" min="10" max="90" value="30"></div>
      </div>
      <label class="fld">Message de fin</label>
      <textarea id="cfgEnd">Score en poche. Le fil est toujours là.</textarea>
    </div>
    <div class="actions">
      <button class="btn btnGo" id="btnStart">Lancer 30 s</button>
      <a class="btn btnGhost" href="studio.html">Retour catalogue</a>
    </div>
  </aside>
  <section id="playCol">
    <div id="app">
      <div id="top">
        <a id="back" href="studio.html">Retour<br>studio</a>
        <div id="title">MURMURE</div>
      </div>
      <div id="tag">Attrapez le calme. Laissez passer la perceuse.</div>
      <div id="infos">
        <div class="pill">SCORE <span id="sc">0</span></div>
        <div class="pill">TEMPS <span id="tm">30</span>s</div>
      </div>
      <div id="arena"></div>
      <div id="overlay">
        <div>
          <h2 id="ovTitle">MURMURE</h2>
          <p id="ovText"></p>
          <button class="btnPrimary" id="ovBtn">Rejouer</button>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
function $(id){return document.getElementById(id)}
const state={
  title:"MURMURE",
  tag:"Attrapez le calme. Laissez passer la perceuse.",
  goodName:"Calme", badName:"Perceuse",
  good:"murmure/fin_silence.jpg",
  bad:"murmure/bg_perceuse.jpg",
  time:30,
  end:"Score en poche. Le fil est toujours là."
};
let score=0, left=30, running=false, holes=[], popT=null, clockT=null, current=-1;
function applyChrome(){
  $("title").textContent=state.title;
  $("tag").textContent=state.tag;
  $("goodThumb").style.backgroundImage=`url(${state.good})`;
  $("badThumb").style.backgroundImage=`url(${state.bad})`;
  $("btnStart").textContent="Lancer "+state.time+" s";
}
function build(){
  const a=$("arena"); a.innerHTML=""; holes=[];
  for(let i=0;i<9;i++){
    const h=document.createElement("div");
    h.className="hole";
    h.onclick=()=>whack(i);
    a.appendChild(h); holes.push(h);
  }
}
function hideAll(){
  holes.forEach(h=>{h.className="hole"; h.innerHTML="";});
  current=-1;
}
function pop(){
  if(!running) return;
  hideAll();
  const i=Math.floor(Math.random()*9);
  const good=Math.random()<0.65;
  const h=holes[i];
  h.className="hole show "+(good?"good":"bad");
  h.dataset.kind=good?"good":"bad";
  const src=good?state.good:state.bad;
  const label=good?state.goodName:state.badName;
  h.innerHTML=src?`<img src="${src}" alt="${label}">`:`<div class="ph">${label}</div>`;
  current=i;
  const dur=700+Math.random()*500;
  popT=setTimeout(()=>{if(running){hideAll(); pop();}}, dur);
}
function whack(i){
  if(!running || i!==current) return;
  const kind=holes[i].dataset.kind;
  if(kind==="good") score+=10; else score=Math.max(0,score-8);
  $("sc").textContent=score;
  hideAll();
  clearTimeout(popT);
  popT=setTimeout(pop,180);
}
function start(){
  clearTimeout(popT); clearInterval(clockT);
  score=0; left=state.time; running=true;
  $("sc").textContent=0; $("tm").textContent=left;
  $("overlay").classList.remove("show");
  hideAll(); pop();
  clockT=setInterval(()=>{
    left--; $("tm").textContent=left;
    if(left<=0) finish();
  },1000);
}
function finish(){
  running=false; clearTimeout(popT); clearInterval(clockT); hideAll();
  $("ovTitle").textContent=state.title;
  $("ovText").textContent=score+" pts — "+state.end;
  $("overlay").classList.add("show");
}
function readFile(input, key){
  input.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{state[key]=r.result; applyChrome();};
    r.readAsDataURL(f);
  };
}
$("cfgTitle").oninput=e=>{state.title=e.target.value; applyChrome();};
$("cfgTag").oninput=e=>{state.tag=e.target.value; applyChrome();};
$("cfgGoodName").oninput=e=>{state.goodName=e.target.value;};
$("cfgBadName").oninput=e=>{state.badName=e.target.value;};
$("cfgTime").oninput=e=>{state.time=Math.max(10,Math.min(90,+e.target.value||30)); applyChrome();};
$("cfgEnd").oninput=e=>{state.end=e.target.value;};
readFile($("cfgGood"),"good");
readFile($("cfgBad"),"bad");
$("btnStart").onclick=start;
$("ovBtn").onclick=start;
applyChrome(); build();
</script>
</body>
</html>
